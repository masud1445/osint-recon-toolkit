name: Tests and dependency audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest --cov=osint_recon --cov-report=term-missing
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pip-audit
      - run: python -m pip_audit

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test,browser]" ruff
      - run: ruff check src tests scripts
      - run: python -m playwright install --with-deps chromium
      - name: Browser, responsive and print checks
        shell: bash
        run: |
          osint-dashboard --data-dir "$RUNNER_TEMP/osint-web" --port 8765 > "$RUNNER_TEMP/osint-web.log" 2>&1 &
          dashboard_pid=$!
          trap 'kill "$dashboard_pid" || true' EXIT
          python -c "import time, requests; [(time.sleep(0.2)) for _ in range(10)]; assert requests.get('http://127.0.0.1:8765').status_code == 200"
          python scripts/verify_dashboard.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dashboard-visual-review
          path: reports/visual-review/
