[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-recon-toolkit"
version = "6.1.0"
description = "Authorized passive domain and IP intelligence assessment"
requires-python = ">=3.10"
dependencies = ["requests>=2.32.4,<3", "Jinja2>=3.1.6,<4", "Flask>=3.1.2,<4", "waitress>=3.0.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8"]
browser = ["playwright>=1.51,<2"]

[project.scripts]
osint-recon = "osint_recon.cli:main"
osint-dashboard = "osint_recon.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
osint_recon = ["templates/*.html", "static/*.css", "static/*.js"]
